server:
  port: ${SERVER_PORT:8088}
  servlet:
    context-path: /api
  # 添加Tomcat异步请求配置
  tomcat:
    threads:
      max: 200 # 最大工作线程数
    # 连接建立后等待请求行的时间，兼作 keep-alive 空闲超时（Tomcat 默认 20s）。
    #
    # 注意：它**不控制响应时长**，因此与 SSE 流式对话无关——SSE 的存活时间由
    # AbstractMessageHandler.CONNECTION_TIMEOUT（10 分钟）设在 SseEmitter 上决定。
    # 这里曾被设成 2000000（33 分钟），对流式毫无帮助，却让空闲和半开连接被长期持有；
    # 配合下面 10000 的 max-connections，慢连接很容易把连接器占满。
    connection-timeout: 20000 # 连接超时毫秒
    max-connections: 10000 # 最大连接数
    accept-count: 100 # 等待队列长度

spring:
  application:
    name: AgentX
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple: # 添加 simple 下的并发配置
        concurrency: 19
        max-concurrency: 19
        prefetch: 1
        acknowledge-mode: manual
        default-requeue-rejected: true
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 3000
      direct:
        acknowledge-mode: manual
        default-requeue-rejected: true
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 3000
    publisher-returns: true
    publisher-confirm-type: correlated
    connection-timeout: 200000
    cache:
      channel:
        size: 25 # 添加通道缓存大小
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agentx}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: org.lucas.domain
  type-handlers-package: org.lucas.infrastructure.converter
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted_at
      logic-delete-value: now()
      logic-not-delete-value: "null"
    banner: false

logging:
  level:
    root: info
    org.lucas: debug
  file:
    name: logs/agent-x.log
mail:
  smtp:
    host: ${MAIL_SMTP_HOST:smtp.gmail.com}
    port: ${MAIL_SMTP_PORT:587}
    username: ${MAIL_SMTP_USERNAME}
    password: ${MAIL_SMTP_PASSWORD}
  verification:
    template: |
      您好，

      您正在使用 RAG 智能 Agent 平台。

      邮箱验证码：%s
      有效期为 10 分钟，请勿泄露给他人。

      如非本人操作，请忽略本邮件。

      — RAG 智能 Agent 平台 团队
    subject: ${MAIL_VERIFICATION_SUBJECT:【RAG 智能 Agent 平台】邮箱验证码}

oss:
  endpoint: ${OSS_ENDPOINT:${S3_ENDPOINT}}
  bucket-name: ${OSS_BUCKET_NAME:${S3_BUCKET_NAME}}
  access-key: ${OSS_ACCESS_KEY:${S3_SECRET_ID}}
  secret-key: ${OSS_SECRET_KEY:${S3_SECRET_KEY}}

embedding:
  name: OpenAI
  vector-store:
    host: ${VECTOR_DB_HOST:${DB_HOST:localhost}}
    port: ${VECTOR_DB_PORT:${DB_PORT:5432}}
    user: ${VECTOR_DB_USER:${DB_USER:postgres}}
    password: ${VECTOR_DB_PASSWORD:${DB_PASSWORD:postgres}}
    database: ${VECTOR_DB_NAME:${DB_NAME:agentx}}
    table: ${VECTOR_DB_TABLE:public.vector_store}
    dimension: ${VECTOR_DB_DIMENSION:1024}
    drop-table-first: ${VECTOR_DB_DROP_TABLE_FIRST:false}
    create-table: ${VECTOR_DB_CREATE_TABLE:true}

cors:
  # 允许的前端来源，逗号分隔，支持端口通配（Spring origin pattern）。
  # 默认放开本机任意端口，方便 dev server 换端口时不被 CORS 拦成空响应体的 403。
  # 生产环境务必显式配置为真实域名，例如 CORS_ALLOWED_ORIGINS=https://app.example.com
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],http://localhost,http://127.0.0.1}

config:
  # 服务商 API Key 落库时的加密密钥（AES/GCM）。无默认值，缺失时启动失败。
  # 生成：openssl rand -base64 32
  encryption:
    key: ${CONFIG_ENCRYPTION_KEY:}

rerank:
  name: OpenAI
  api-key: ${SILICONFLOW_API_KEY}
  api-url: ${SILICONFLOW_API_URL_RERANK:https://api.siliconflow.cn/v1/rerank}
  model: ${SILICONFLOW_MODEL_RERANK_MODEL:Qwen/Qwen3-Reranker-8B}
  timeout: ${SILICONFLOW_TIMEOUT:30000}

dromara:
  x-file-storage: #文件存储配置
    default-platform: amazon-s3-1 #默认使用的存储平台
    thumbnail-suffix: ".min.jpg" #缩略图后缀，例如【.min.jpg】【.png】
    #对应平台的配置写在这里，注意缩进要对齐
    amazon-s3: # 0.0.7 及以前的版本，配置名称是：aws-s3
      - platform: amazon-s3-1 # 存储平台标识
        enable-storage: true # 启用存储
        access-key: ${S3_SECRET_ID}
        secret-key: ${S3_SECRET_KEY}
        region: ${S3_REGION:cn-south-1} # 与 end-point 参数至少填一个
        end-point: ${S3_ENDPOINT:https://s3.cn-south-1.qiniucs.com} # 与 region 参数至少填一个
        bucket-name: ${S3_BUCKET_NAME:agentx-test-lucas}
        domain: ${S3_DOMAIN:https://agentx-test-lucas.s3.cn-south-1.qiniucs.com/} # 访问域名，注意“/”结尾
        base-path: s3/ # 基础路径
