
# ================================
# RAG Agent Platform - 完整部署方案
# ================================

services:
  # ================================
  # RabbitMQ
  # ================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: agentx-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: /
      TZ: Asia/Shanghai
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - agentx-network
    mem_limit: 512m
    cpus: "0.3"
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M

  # ================================
  # 后端 Spring Boot 应用
  # ================================
  backend:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    # IMAGE_TAG 由 CI 部署时写入 .env（值为 commit SHA），本地/手动场景回落到 latest。
    # 固化成 SHA 是为了让「服务器上正在跑的是哪个版本」可追溯，也方便回滚。
    image: crpi-c6nc3ef4yktaqunc.cn-beijing.personal.cr.aliyuncs.com/lucas_acr/rag-agent-platform:backend-${IMAGE_TAG:-latest}
    container_name: agentx-backend
    restart: unless-stopped
    environment:
      # 服务器配置
      SERVER_PORT: ${SERVER_PORT:-8088}

      # 数据库配置（使用外部阿里云 RDS）
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-agentx}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # 向量数据库配置（使用外部阿里云 RDS）
      VECTOR_DB_HOST: ${DB_HOST}
      VECTOR_DB_PORT: ${DB_PORT:-5432}
      VECTOR_DB_NAME: ${DB_NAME:-agentx}
      VECTOR_DB_USER: ${DB_USER}
      VECTOR_DB_PASSWORD: ${DB_PASSWORD}

      # RabbitMQ 配置
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}

      # S3 对象存储配置
      S3_SECRET_ID: ${S3_SECRET_ID}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-cn-south-1}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_DOMAIN: ${S3_DOMAIN}

      # AI 模型配置
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      SILICONFLOW_API_URL_RERANK: ${SILICONFLOW_API_URL_RERANK:-https://api.siliconflow.com/v1/rerank}
      SILICONFLOW_MODEL_RERANK_MODEL: ${SILICONFLOW_MODEL_RERANK_MODEL:-Qwen/Qwen3-Reranker-4B}

      # 敏感配置加密密钥（必填，无默认值）
      # 用于加密服务商配置中的模型 API Key。缺失时后端启动即失败——这是有意为之，
      # 回落到默认密钥等于没有加密。生成方式：openssl rand -base64 32
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?必须在 .env 中设置 CONFIG_ENCRYPTION_KEY}
      # 设为 true 时启动执行一次存量数据加密格式迁移，完成后应移除
      CONFIG_CRYPTO_MIGRATE: ${CONFIG_CRYPTO_MIGRATE:-false}

      # LLM 调用超时（秒）
      # 非流式：意图识别/语义改写/查询扩展等同步小请求，超时必须短
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-60}
      # 流式：对话补全
      LLM_STREAM_TIMEOUT_SECONDS: ${LLM_STREAM_TIMEOUT_SECONDS:-300}

      # 邮件配置
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-smtp.qq.com}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD}

      # JVM 配置
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx768m -XX:+UseG1GC}

      TZ: Asia/Shanghai
    volumes:
      - backend_logs:/app/logs
      # ⚠️ 关键：挂载 Docker Socket（容器管理功能需要）
      - /var/run/docker.sock:/var/run/docker.sock
      # 用户容器数据卷目录
      - container_volumes:/var/agentx/containers
    ports:
      - "${SERVER_PORT:-8088}:8088"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - agentx-network
    mem_limit: 1536m
    cpus: "1.2"
    deploy:
      resources:
        limits:
          cpus: '1.2'
          memory: 1536M
        reservations:
          cpus: '0.8'
          memory: 768M

  # ================================
  # 前端 Next.js 应用
  # ================================
  frontend:
    image: crpi-c6nc3ef4yktaqunc.cn-beijing.personal.cr.aliyuncs.com/lucas_acr/rag-agent-platform:frontend-${IMAGE_TAG:-latest}
    container_name: agentx-frontend
    restart: unless-stopped
    environment:
      # 后端 API 地址（必须在 .env 文件中配置为公网可访问地址）
      # 直接暴露: http://your-server-ip:8088/api
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NEXT_PUBLIC_PREFILL_LOGIN: ${NEXT_PUBLIC_PREFILL_LOGIN}
      NEXT_PUBLIC_PREFILL_ACCOUNT: ${NEXT_PUBLIC_PREFILL_ACCOUNT}
      NEXT_PUBLIC_PREFILL_PASSWORD: ${NEXT_PUBLIC_PREFILL_PASSWORD}

      NODE_ENV: production
      TZ: Asia/Shanghai
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - agentx-network
    mem_limit: 768m
    cpus: "0.6"
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 768M
        reservations:
          cpus: '0.3'
          memory: 384M

  # ================================
  # Nginx 反向代理
  # ================================
  nginx:
    image: nginx:1.27-alpine
    container_name: agentx-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - agentx-network

  # ================================
  # GitHub Actions 自托管 Runner
  # ================================
  # 主动向 GitHub 轮询任务（纯出站），因此服务器不必开放 SSH 或任何入站端口，
  # GitHub Secrets 里也不存放服务器凭据。
  #
  # ⚠️ 部署 job 绝不能执行裸的 `docker compose up -d`——那会连同这个 runner 一起重建，
  # 把正在执行的部署任务当场杀掉。deploy.yml 里的命令都显式限定到 backend/frontend。
  runner:
    build:
      context: ./deploy/runner
      args:
        # 国内构建时可在 .env 里覆盖这两项加速。
        # RUNNER_DOWNLOAD_BASE 换镜像站是安全的——Dockerfile 会校验官方 SHA256。
        APT_MIRROR: ${APT_MIRROR-http://mirrors.aliyun.com}
        RUNNER_DOWNLOAD_BASE: ${RUNNER_DOWNLOAD_BASE-https://github.com/actions/runner/releases/download}
    image: agentx-runner:local
    container_name: agentx-runner
    restart: unless-stopped
    environment:
      GITHUB_REPO: ${GITHUB_REPO:-NEDONION/rag-agent-platform}
      GITHUB_PAT: ${GITHUB_PAT}
      RUNNER_NAME: ${RUNNER_NAME:-aliyun-lightweight}
      TZ: Asia/Shanghai
    volumes:
      # 操作宿主机 docker：部署 job 靠它执行 compose pull / up
      - /var/run/docker.sock:/var/run/docker.sock
      # 关键：必须挂载到与宿主机完全相同的绝对路径。
      # compose 把 ./deploy/nginx.conf 这类相对路径解析成绝对路径后交给宿主机 docker 守护进程，
      # 由守护进程按宿主机文件系统去找。容器内外路径不一致的话，挂载的就是错误的位置。
      - ${DEPLOY_PATH:-/root/rag-agent-platform}:${DEPLOY_PATH:-/root/rag-agent-platform}
      # runner 的工作目录持久化，避免每次重启都重新拉取仓库
      - runner_work:/actions-runner/_work
    networks:
      - agentx-network
    mem_limit: 512m
    cpus: "0.3"

# ================================
# 数据卷
# ================================
volumes:
  rabbitmq_data:
    driver: local
  backend_logs:
    driver: local
  container_volumes:
    driver: local
  runner_work:
    driver: local

# ================================
# 网络
# ================================
networks:
  agentx-network:
    driver: bridge
