# 构建镜像推送到阿里云 ACR，然后 SSH 到轻量服务器完成部署。
#
# 触发：push 到 main，或在 Actions 页面手动运行。
# 所需 Secrets 见 DEPLOY.md「CI/CD」一节。
name: Deploy

on:
  push:
    branches: [main]
    # 只改文档不触发部署
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

# 同一时间只允许一个部署在跑；新的部署不打断正在进行的那个，排队等它结束。
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: crpi-c6nc3ef4yktaqunc.cn-beijing.personal.cr.aliyuncs.com
  NAMESPACE: lucas_acr
  REPO: rag-agent-platform

jobs:
  build:
    name: 构建 ${{ matrix.component }} 镜像
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: ./Dockerfile
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # 同时打两个标签：commit SHA 用于精确部署和回滚，latest 用于人工排查。
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:${{ matrix.component }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:${{ matrix.component }}-latest
          # 复用上次构建的层（Maven 依赖、node_modules），否则每次都要重新下载。
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: 部署到轻量服务器
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 固定服务器指纹，避免中间人；同时不用 StrictHostKeyChecking=no
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      - name: 同步部署配置到服务器
        # 只同步这两个文件。服务器上的 .env 存着密钥，绝不覆盖。
        run: |
          scp -i ~/.ssh/deploy_key -P "${SSH_PORT:-22}" \
            docker-compose.yml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.yml"
          scp -i ~/.ssh/deploy_key -P "${SSH_PORT:-22}" \
            deploy/nginx.conf \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/deploy/nginx.conf"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: 拉取镜像并重启服务
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            IMAGE_TAG="$GITHUB_SHA" DEPLOY_PATH="$DEPLOY_PATH" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # 把本次部署的 tag 固化进 .env，这样之后手动 docker compose up -d
          # 起来的还是同一个版本，而不是漂移到 latest。
          if grep -q '^IMAGE_TAG=' .env 2>/dev/null; then
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$IMAGE_TAG|" .env
          else
            echo "IMAGE_TAG=$IMAGE_TAG" >> .env
          fi

          docker compose pull backend frontend
          docker compose up -d
          # nginx.conf 是挂载进去的，改了要重启容器才生效
          docker compose restart nginx

          # 清理旧镜像，轻量服务器磁盘有限
          docker image prune -f
          REMOTE
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: 健康检查
        # 部署不算完成，除非服务真的起来了。失败就让这次 workflow 红掉。
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            DEPLOY_PATH="$DEPLOY_PATH" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8088/api/health > /dev/null \
               && curl -fsS http://localhost:3000/api/health > /dev/null; then
              echo "✅ 后端与前端健康检查通过（第 ${i} 次尝试）"
              exit 0
            fi
            echo "等待服务就绪... (${i}/30)"
            sleep 10
          done
          echo "❌ 健康检查超时，输出最近日志："
          docker compose logs --tail=80 backend frontend
          exit 1
          REMOTE
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: 清理 SSH 私钥
        if: always()
        run: rm -f ~/.ssh/deploy_key
