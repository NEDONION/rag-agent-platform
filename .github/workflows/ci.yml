# PR 校验：确保合进 main 的代码至少能编译、能构建。
# 不推镜像、不碰服务器 —— 部署由 deploy.yml 负责。
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端编译与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # 跑测试而非只编译：EncryptUtilsTest 锁住「v1 遗留密文仍可解密」这条不变量，
      # 一旦回归，线上全部存量服务商配置会立刻读不出来。
      #
      # 刻意不设置 CONFIG_ENCRYPTION_KEY：测试自带密钥，且只有缺少该变量时，
      # 「密钥缺失应启动失败」的两个用例才会真正执行（配了则自动跳过）。
      - name: mvn test
        run: mvn -B test

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # 版本由 frontend/package.json 的 packageManager 字段决定（pnpm@8.15.9），
      # 与仓库 lockfile v6.0 及 Dockerfile 保持一致。此处曾写死 version: 9，
      # 与 lockfile 版本不匹配，只能靠 --no-frozen-lockfile 掩盖。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 构建
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  nginx:
    name: nginx 配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: nginx -t
        # nginx -t 在配置检查阶段就会解析 proxy_pass 里的 upstream 主机名，
        # 而 CI 环境里没有 backend/frontend 这两个容器，解析不到就直接 emerg 退出。
        # 用 --add-host 造两条 hosts 记录让名字可解析——这里校验的是配置语法，
        # 解析到哪个地址无关紧要。
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --add-host frontend:127.0.0.1 \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
